name: Build Mines APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Show project
        run: |
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name "buildozer.spec" -print -quit)")

          echo "Project directory: $PROJECT_DIR"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi

          cd "$PROJECT_DIR"

          echo "Running Buildozer..."
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mines-APK
          path: "**/bin/*.apk"
